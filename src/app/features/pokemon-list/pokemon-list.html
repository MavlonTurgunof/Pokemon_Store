<app-container>
  <div class="p-6">
    @if (error()) {
      <p class="text-center text-red-500">{{ error() }}</p>
    }

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (pokemon of pokemonList(); track pokemon.id) {
        <app-pokemon-card [pokemon]="pokemon" (showMore)="onCardClick($event)" />
      }
    </div>

    @if (loading()) {
      <p class="text-center text-gray-500 mt-6">Loading...</p>
    }

    @if (hasMore() && !loading()) {
      <app-scroll-trigger (visible)="onScrollEnd()" />
    }
  </div>
</app-container>
