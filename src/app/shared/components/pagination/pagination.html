<div class="flex justify-center items-center gap-2 mt-8">
  <button
    (click)="onPrevious()"
    [disabled]="currentPage() === 1"
    class="px-3 py-1 rounded-full text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-100 transition-colors"
  >
    ‹ Prev
  </button>
  @for (page of pages(); track page) {
    <button
      (click)="goToPage(page)"
      class="w-9 h-9 rounded-full text-sm font-medium transition-colors"
      [class.bg-yellow-400]="page === currentPage()"
      [class.text-white]="page === currentPage()"
      [class.hover:bg-gray-100]="page !== currentPage()"
    >
      {{ page }}
    </button>
  }
  <button
    (click)="onNext()"
    [disabled]="currentPage() === totalPages()"
    class="px-3 py-1 rounded-full text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-100 transition-colors"
  >
    Next ›
  </button>
</div>
